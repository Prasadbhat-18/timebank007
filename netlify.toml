[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "mongoose", "pdfkit", "nodemailer", "web-push", "ethers", "jsonwebtoken", "bcryptjs", "serverless-http", "cors"]

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  NODE_ENV = "development"
  NETLIFY_DISABLE_DRAWER = "true"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,JWT_SECRET,FRAUD_HASH_SECRET,SMTP_PASS,VAPID_PRIVATE_KEY,RELAYER_PRIVATE_KEY,MONGODB_URI"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,NETLIFY_DEPLOYMENT.md"

# Route all /api requests directly to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Prevent missing assets from returning index.html 200 (prevents MIME type script errors and cache corruption)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single Page Application fallback for React client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

